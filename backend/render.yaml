services:
  - type: web
    name: radio-station
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: HOST_KEY
        sync: false
      - key: UPI_ID
        sync: false
      - key: PAYEE_NAME
        sync: false
      - key: STATION_NAME
        value: Radio Mehfil
      - key: PRICE
        value: "20"
      - key: TURN_URL
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false
